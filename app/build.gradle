plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.empresa.vaultdrive'
    compileSdk 34

    defaultConfig {
        applicationId "com.empresa.vaultdrive"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"

        buildConfigField "String", "CLIENT_ID", '"f76b6c71-4faf-49b8-8f52-aa3efab90c69"'
        buildConfigField "String", "TENANT_ID", '"ce41ecbd-c265-4b29-b346-e21bacf98945"'

        manifestPlaceholders = [
                msalRedirectUri: "msauth://com.empresa.vaultdrive/JyL6wKNfIOBQEtXiJeu7yPXvOWo="
        ]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.security:security-crypto:1.0.0'

    // ✅ MSAL CORREGIDO (evita display-mask crash)
    implementation("com.microsoft.identity.client:msal:5.7.0") {
        exclude group: "com.microsoft.device.display", module: "display-mask"
    }

    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'io.coil-kt:coil:2.5.0'
}
